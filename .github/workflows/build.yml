name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - README.md
      - docs/**
      - .github/workflows/build.yml
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          pull: true
          load: true
          tags: dockrclone:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dockrclone:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test image
        run: |
          docker run --rm dockrclone:test rclone version
          mkdir -p "$RUNNER_TEMP/source/one" "$RUNNER_TEMP/source/two" "$RUNNER_TEMP/backup" "$RUNNER_TEMP/config"
          printf 'first source\n' > "$RUNNER_TEMP/source/one/file"
          printf 'second source\n' > "$RUNNER_TEMP/source/two/file"
          cat > "$RUNNER_TEMP/config/rclone.conf" <<'EOF'
          [backup]
          type = alias
          remote = /backup
          EOF
          cat > "$RUNNER_TEMP/config/jobs.yml" <<'EOF'
          jobs:
            - name: one
              schedule: "0 3 * * *"
              source: /source/one
              destination: "backup:one"
              mode: copy
            - name: two
              schedule: "0 4 * * *"
              source: /source/two
              destination: "backup:two"
              mode: sync
          EOF
          docker run --rm \
            -v "$RUNNER_TEMP/source:/source:ro" \
            -v "$RUNNER_TEMP/backup:/backup" \
            -v "$RUNNER_TEMP/config:/config:ro" \
            dockrclone:test validate
          docker run --rm \
            -v "$RUNNER_TEMP/source:/source:ro" \
            -v "$RUNNER_TEMP/backup:/backup" \
            -v "$RUNNER_TEMP/config:/config:ro" \
            dockrclone:test backup
          test -d "$RUNNER_TEMP/backup/one"
          test -d "$RUNNER_TEMP/backup/two"
          cat > "$RUNNER_TEMP/config/jobs.yml" <<'EOF'
          jobs:
            - name: missing-source
              schedule: "0 3 * * *"
              source: /source/missing
              destination: "backup:missing"
              mode: copy
          EOF
          if docker run --rm \
            -v "$RUNNER_TEMP/source:/source:ro" \
            -v "$RUNNER_TEMP/backup:/backup" \
            -v "$RUNNER_TEMP/config:/config:ro" \
            dockrclone:test validate; then
            echo "missing source unexpectedly succeeded" >&2
            exit 1
          fi

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
