name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: dockstorebackup:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dockstorebackup:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test image
        run: |
          mkdir -p "$RUNNER_TEMP/source/one" "$RUNNER_TEMP/source/two" "$RUNNER_TEMP/backup"
          printf 'first source\n' > "$RUNNER_TEMP/source/one/file"
          printf 'second source\n' > "$RUNNER_TEMP/source/two/file"
          python3 tests/kuma_server.py "$RUNNER_TEMP/kuma-requests" &
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "$RUNNER_TEMP/source:/source:ro" \
            -v "$RUNNER_TEMP/backup:/backup" \
            -e $'SOURCES=one=/source/one\ntwo=/source/two' \
            -e KUMA_BASE=http://host.docker.internal:18080 \
            -e KUMA_TOKEN=test-token \
            dockstorebackup:test backup
          test -d "$RUNNER_TEMP/backup/one"
          test -d "$RUNNER_TEMP/backup/two"
          if docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "$RUNNER_TEMP/source:/source:ro" \
            -v "$RUNNER_TEMP/backup:/backup" \
            -e SOURCES=missing=/source/missing \
            -e KUMA_BASE=http://host.docker.internal:18080 \
            -e KUMA_TOKEN=test-token \
            dockstorebackup:test backup; then
            echo "missing source unexpectedly succeeded" >&2
            exit 1
          fi
          wait
          grep -F '/api/push/test-token?status=up&msg=ok' "$RUNNER_TEMP/kuma-requests"
          grep -F 'status=down&msg=' "$RUNNER_TEMP/kuma-requests"

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
