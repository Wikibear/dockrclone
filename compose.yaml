name: dockstorebackup

services:
  storebackup:
    image: ghcr.io/wikibear/dockstorebackup:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Berlin
      SCHEDULE: "0 3 * * *"
      SOURCE_DIR: /source
      BACKUP_DIR: /backup
      SERIES: default
      KEEP_DAYS: "7"
      KEEP_WEEKS: "4"
      KEEP_MONTHS: "12"
      KUMA_PUSH_URL: ""
    volumes:
      - /var/lib/docker/volumes:/source:ro
      - /mnt/backup:/backup
